[pytest]
# Both directories. `tests/` grew alongside the v0.8 port; `vagen/tests/` predates it
# and was never being run -- ten of its tests were failing, including the one that pins
# the order of the concatenated training sequence, which is how a regression in that
# order went unnoticed.
testpaths = tests vagen/tests

# Run the suite with `pytest` from the repo root; nothing else is needed.
#
# `verl` is here because it is a submodule rather than a dependency pytest can find on
# its own. Without it 27 modules fail to collect with `No module named 'verl.trainer'` --
# misleading, because bare `import verl` still "succeeds" as a namespace package
# resolving to the submodule's repo root.
pythonpath = . verl

# The suite is 58 async tests across 10 files; without the plugin they fail rather than
# skip. `pip install -e ".[test]"` supplies it.
required_plugins = pytest-asyncio
asyncio_mode = strict

# `empty_parameter_set_mark`: several suites parametrize over files discovered by
# globbing the repo. Run from another directory those globs come back empty and pytest
# silently reports them as skips -- 189 cases evaporated into 7 green skips. Collecting
# nothing is a broken test, not a passing one.
empty_parameter_set_mark = fail_at_collect
xfail_strict = true
addopts = --strict-markers --strict-config -ra

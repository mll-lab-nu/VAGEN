# ★ max_env_response_per_turn is written out as `null` on purpose: no ceiling, never cut
# an observation. Navigation runs against a remote AI2-THOR server, so a frame's token cost
# is a property of that server's render settings rather than of anything in this repo, and
# an over-ceiling observation is now truncated rather than refused -- a plausible but
# unmeasured number would silently discard real context. Measure it against your own server
# if you want the static budget checks to be exact.
envs:
  - name: RemoteEnv
    n_envs: 60
    data_source: navigation_base
    seed: [1, 60, 1]
    max_turns: 10
    response_length_per_turn: 512
    max_env_response_per_turn: null
    config:
      base_urls: "http://localhost:8000"
      timeout: 120
      retries: 3
      eval_set: base
      prompt_format: eval_mode
      max_actions_per_step: 5

  - name: RemoteEnv
    n_envs: 60
    data_source: navigation_common
    seed: [1, 60, 1]
    max_turns: 10
    response_length_per_turn: 512
    max_env_response_per_turn: null
    config:
      base_urls: "http://localhost:8000"
      timeout: 120
      retries: 3
      eval_set: common_sense
      prompt_format: eval_mode
      max_actions_per_step: 5

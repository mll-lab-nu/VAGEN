# max_env_response_per_turn is left unset here, so it takes the 2048 default. Navigation
# runs against a remote AI2-THOR server and a frame's token cost is a property of that
# server's render settings, so there is no number this repo can honestly measure. Declare
# it once you have measured yours; it is the ceiling an observation is truncated to.
envs:
  - name: RemoteEnv
    n_envs: 60
    data_source: navigation
    # 60 values for 60 envs, so every task is drawn exactly once. Indices come out as
    # `seed % 60`, so 1..59 map to themselves and 60 maps to 0.
    seed: [1, 60, 1]
    max_turns: 10
    response_length_per_turn: 512
    config:
      base_urls: "http://localhost:8000"
      timeout: 120
      retries: 3
      eval_set: base
      prompt_format: eval_mode
      max_actions_per_step: 5

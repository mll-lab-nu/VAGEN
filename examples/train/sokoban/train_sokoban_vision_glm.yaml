# GLM training uses the same complete world-model contract as the established Sokoban
# runs.  Keep this strict: a bare action is useful for engine diagnostics, but is not a
# valid training response because it supplies no state description or prediction.
envs:
  - name: Sokoban
    n_envs: 10000
    data_source: sokoban
    seed: [1,10000,1]
    max_turns: 5
    response_length_per_turn: 512
    max_env_response_per_turn: 320
    config:
      render_mode: vision
      prompt_format: wm
      strict_format: true
      format_reward: 0.02
      min_solution_steps: [1,5]

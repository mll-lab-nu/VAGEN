# GLM has a native reasoning channel. Ask it to mark only the action instead of making
# it reproduce observation/prediction prose inside another protocol; the latter produced
# no valid actions in the base-model preflight.
envs:
  - name: Sokoban
    n_envs: 10000
    data_source: sokoban
    seed: [1,10000,1]
    max_turns: 5
    response_length_per_turn: 512
    max_env_response_per_turn: 320
    config:
      render_mode: vision
      prompt_format: answer
      format_reward: 0.02
      min_solution_steps: [1,5]

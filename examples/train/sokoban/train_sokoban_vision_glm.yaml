# Canonical free-think is <think>...</think><answer>...</answer>. GLM may initially use
# its native boxed answer; that action is salvaged for rollout continuity but receives no
# format reward until the model adopts the shared tags.
envs:
  - name: Sokoban
    n_envs: 10000
    data_source: sokoban
    seed: [1,10000,1]
    max_turns: 5
    response_length_per_turn: 512
    max_env_response_per_turn: 320
    stop_strings: ["</answer>", "<|end_of_box|>"]
    config:
      render_mode: vision
      prompt_format: free_think
      strict_format: false
      format_reward: 0.02
      min_solution_steps: [1,5]

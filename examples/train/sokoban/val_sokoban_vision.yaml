# Validation split matching the original Sokoban environment and reward scale.
envs:
  - name: Sokoban
    n_envs: 256
    data_source: sokoban
    seed: [10001,10256,1]
    max_turns: 5
    response_length_per_turn: 512
    max_env_response_per_turn: 256
    config:
      render_mode: vision
      format_reward: 0.02
      min_solution_steps: [1,5]

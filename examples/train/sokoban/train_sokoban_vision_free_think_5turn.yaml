# free_think at a real per-turn budget: 5 turns of 2048 instead of 1 turn of 16384.
#
# `response_length_per_turn` is a hard cap -- gym_loop passes it to the client as the
# response limit, so it becomes max_new_tokens for the generation. Nothing softer is
# needed to stop Qwen3.5 rambling; the 16384 in the `_think` and `_free_think` yamls was a
# diagnostic value, chosen to tell "the budget is too small" apart from "the model never
# terminates", and it answered that question: the model never terminates.
#
# ★ The episode fits, and by a wide margin, because observations are cheap. Measured with
# Qwen3.5's processor on the 96x96 sokoban frame: 80 tokens for the opening observation,
# 96 mid-episode. So the concat episode costs
#     5 x 2048  +  4 x 96   =  10624 tokens of response region
# against the 11264 configured, with the system prompt (370) and first observation in the
# 1000-token prompt region. Total window ~12.3k. The 4608 that older runs saw in the
# budget warning was never an observation size -- it was `default_env_response`, a quarter
# of the response region, standing in for a number no config had set.
#
# ★ At this cap ~16% of rollouts terminated at step 0, measured by replaying the free_think
# validation distribution (n=256: median terminated trace 3353 tokens, p25 1463). The rest
# score format 0 and have their actions discarded, which is the intended pressure and not
# a dead batch -- but it is a thin cold start, so watch format_correct_rate over the first
# ~20 steps. If it does not climb, the next lever is budget forcing (inject `</think>` at
# the cap so the model must answer) rather than a larger budget.
envs:
  - name: Sokoban # registered env name
    n_envs: 10000
    data_source: sokoban # nickname for logging
    seed: [1,10000,1] # sample n_env seeds from seed[0] to seed[1] with each seed repeat at most seed[2] times
    max_turns: 5 # max number of interaction turns per episode
    response_length_per_turn: 2048 # hard cap on one generation
    # The environment-side twin of the line above. 256 against a measured 96 leaves room
    # for a larger frame without letting a runaway observation eat the response region;
    # unset, this would default to 2048, and before that to a tenth of the region.
    max_env_response_per_turn: 256
    # Force the reasoning block closed at 512 tokens instead of letting the turn be cut
    # mid-thought. `response_length_per_turn` above is still the hard ceiling on the whole
    # turn; this bounds only the thinking inside it, and leaves room for the answer.
    # Needs rollout.engine_kwargs.vllm.reasoning_config set -- see the training script.
    thinking_token_budget: 512
    config: # env-specific config
      render_mode: vision
      prompt_format: free_think
      use_example_in_sys_prompt: True
      # 0.02 a turn, not the 0.1 default: at max_turns=5 the default pays 0.5 for
      # formatting alone, half of what solving the level is worth. 0.02 pays 0.10 over
      # the episode, matching what the two state rewards pay together.
      format_reward: 0.02
      min_solution_steps: [1,5]

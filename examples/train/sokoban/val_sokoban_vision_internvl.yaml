# Validation half of train_sokoban_vision_internvl.yaml. Keep the action-only protocol
# and reward settings identical; only the held-out seeds and environment count differ.
envs:
  - name: Sokoban
    n_envs: 256
    data_source: sokoban
    seed: [10001,10256,1]
    max_turns: 5
    response_length_per_turn: 512
    max_env_response_per_turn: 320
    config:
      render_mode: vision
      prompt_format: answer
      format_reward: 0.02
      min_solution_steps: [1,5]

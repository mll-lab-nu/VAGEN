envs:
  - name: Sokoban
    n_envs: 256
    data_source: sokoban
    seed: [10001,10256,1]
    max_turns: 5
    response_length_per_turn: 512
    # Match training: InternVL3.5 needs 278-292 tokens for a continuation, while
    # Qwen2.5-VL needs only 80-96. 320 covers both families. Undeclared this falls back to
    # DEFAULT_MAX_ENV_RESPONSE=2048, which is not a bound on anything this env does
    # and makes the episode-size warning fire on every run until nobody reads it.
    max_env_response_per_turn: 320
    config:
      render_mode: vision
      min_solution_steps: [1,5]
      prompt_format: free_wm
      # 0.02 a turn, not the 0.1 default: at max_turns=5 the default pays 0.5 for
      # formatting alone, half of what solving the level is worth. Every other
      # sokoban yaml sets this; these two inherited the default silently, so the
      # same model on the grpo and default_gae scripts ran on incomparable rewards.
      format_reward: 0.02

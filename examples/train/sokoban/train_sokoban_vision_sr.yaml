# Sokoban training split with state reward enabled. Kept separate from the ordinary
# train_sokoban_vision.yaml so using that shared dataset never starts judge scoring by
# accident.
envs:
  - name: Sokoban
    n_envs: 10000
    data_source: sokoban
    seed: [1,10000,1]
    max_turns: 5
    response_length_per_turn: 512
    max_env_response_per_turn: 256
    config:
      render_mode: vision
      format_reward: 0.02
      min_solution_steps: [1,5]
      state_reward:
        # Absolute rewards for one perfect section on one turn. With both enabled and
        # max_turns=5, perfect descriptions pay 2 * 0.01 * 5 = 0.10 per episode.
        state_estimation:      {enable: true, reward: 0.01}
        transition_prediction: {enable: true, reward: 0.01}
        score_base: 0.334
        judge_base_url: ${oc.env:JUDGE_BASE_URL,http://127.0.0.1:8123/v1}
        judge_model: ${oc.env:JUDGE_MODEL,Qwen/Qwen3-4B-Instruct-2507}

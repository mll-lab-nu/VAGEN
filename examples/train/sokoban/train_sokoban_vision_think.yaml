# The sokoban dataset for models that reason in their own thinking channel.
#
# Only for models whose chat template opens a `<think>` block in the generation prompt --
# Qwen3.5 today. With `data.apply_chat_template_kwargs.enable_thinking=True` the model
# generates its reasoning *inside the response*, so those tokens carry response_mask=1 and
# the RL objective trains them. At the inherited 512 tokens a turn the trace is cut off
# before `</think>`, so no answer is ever produced and the arm silently scores zero --
# the same failure mode Qwen3-VL had under `wm`.
#
# prompt_format is `answer`, not free_wm: with a native <think> block the tag-based
# formats make the model narrate its reasoning twice, and `<think>` is a reserved token
# on these families so the wm form is unreachable outright.
envs:
  - name: Sokoban # registered env name
    n_envs: 10000
    data_source: sokoban # nickname for logging
    seed: [1,10000,1] # sample n_env seeds from seed[0] to seed[1] with each seed repeat at most seed[2] times
    max_turns: 20 # max number of interaction turns per episode
    response_length_per_turn: 16384 # doubling to separate "budget too small" from "model never terminates"
    config: # env-specific config
      render_mode: vision
      prompt_format: answer
      # Native thinking is the reasoning; the system prompt's worked example only
      # teaches the model to imitate a shape it no longer has to produce.
      use_example_in_sys_prompt: False
      # 0.02 a turn, not the 0.1 default: at max_turns=5 the default pays 0.5 for
      # formatting alone, half of what solving the level is worth. 0.02 pays 0.10 over
      # the episode, matching what the two state rewards pay together.
      format_reward: 0.02
      min_solution_steps: [1,5]

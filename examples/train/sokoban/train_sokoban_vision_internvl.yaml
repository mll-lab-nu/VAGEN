# InternVL uses explicit reasoning followed by an answer. Keep the closing reasoning tag
# and action marker strict while avoiding the much heavier full world-model protocol.
envs:
  - name: Sokoban
    n_envs: 10000
    data_source: sokoban
    seed: [1,10000,1]
    max_turns: 5
    # InternVL3.5 often spends 500+ tokens reasoning before it reaches </think> and
    # <answer>. A 512-token cap truncates otherwise valid turns mid-format.
    response_length_per_turn: 1024
    # Close a runaway reasoning block while leaving another 512 tokens for the answer.
    thinking_token_budget: 512
    # InternVL may keep reasoning after a valid action. End the turn at the protocol
    # boundary, retaining the delimiter so the strict parser sees a complete answer.
    stop_strings: ["</answer>"]
    max_env_response_per_turn: 320
    config:
      render_mode: vision
      prompt_format: free_think
      strict_format: true
      format_reward: 0.02
      min_solution_steps: [1,5]

# InternVL uses explicit reasoning followed by an answer. Keep the closing reasoning tag
# and action marker strict while avoiding the much heavier full world-model protocol.
envs:
  - name: Sokoban
    n_envs: 10000
    data_source: sokoban
    seed: [1,10000,1]
    max_turns: 5
    # A 512-token response cap can cut the answer before its closing tags.
    response_length_per_turn: 1024
    # Close long reasoning blocks while leaving room for the answer.
    thinking_token_budget: 512
    # Stop at the complete answer instead of sampling trailing text.
    stop_strings: ["</answer>"]
    max_env_response_per_turn: 320
    config:
      render_mode: vision
      prompt_format: free_think
      strict_format: true
      format_reward: 0.02
      min_solution_steps: [1,5]

# InternVL uses the complete Sokoban world-model contract. Keep it strict so an
# action-only response cannot silently train away observation, reasoning, and prediction.
envs:
  - name: Sokoban
    n_envs: 10000
    data_source: sokoban
    seed: [1,10000,1]
    max_turns: 5
    response_length_per_turn: 512
    max_env_response_per_turn: 320
    config:
      render_mode: vision
      prompt_format: wm
      strict_format: true
      format_reward: 0.02
      min_solution_steps: [1,5]

envs:
  - name: SpatialGym          # registered env name in env_registry.yaml
    n_envs: 50
    data_source: spatial_gym           # nickname for logging
    # Unlike frozenlake/sokoban, the seed here is not a generator seed -- it is an index
    # into a fixed dataset. ImageHandler.load_data resolves it as `run{seed:02d}` under
    # data_dir and asserts the directory exists, so the range cannot exceed what was
    # downloaded. yw12356/spatial_gym_dataset ships run00..run19; this takes the first 16
    # and leaves run16..run19 to val_spatial_gym_vision.yaml.
    #
    # Third element is 4 rather than 1 because 16 rooms cannot fill n_envs=50 at one use
    # each -- the dataset builder raises "seed range with given limit cannot supply enough
    # unique seeds" -- so each room is drawn up to 4 times. The repeats are the same room
    # from the same start; they differ only in what the policy samples.
    seed: [0, 15, 4]         # sample n_envs seeds from seed[0] to seed[1], each used at most seed[2] times
    max_turns: 11              # max_exp_steps=10 exploration turns + 1 cogmap turn
    # Below data.max_response_length, which the scripts set to 18432 -- see their headers
    # for why the region is sized for the whole episode here rather than for a turn.
    response_length_per_turn: 1024
    # What one observation may be. Declared rather than derived: the derivation is
    # deliberately generous and the static checks are only exact against a real number.
    #
    # 700 from measurement, not taste (Qwen2.5-VL processor, run00): the opening
    # observation is 677 tokens across 2 images and the largest mid-episode one is 349.
    # The opening is charged against max_prompt_length (4000 here), not against this, so
    # this only has to cover a rendered view.
    max_env_response_per_turn: 700
    config:
      exp_type: active
      render_mode: vision
      max_exp_steps: 10
      data_dir: vagen/envs/spatial_gym/room_data/1-room
      eval_tasks:
        - task_type: rot
          task_kwargs: {}
      prompt_config:
        enable_think: true

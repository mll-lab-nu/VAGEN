envs:
  - name: FrozenLake # registered env name
    n_envs: 10000
    data_source: frozenlake # nickname for logging
    seed: [1,10000,1] # sample n_env seeds from seed[0] to seed[1] with each seed repeat at most seed[2] times
    max_turns: 5 # max number of interaction turns per episode
    response_length_per_turn: 512 # max response length per turn
    # The largest one observation may be. Measured with the Qwen2.5-VL processor:
    # frozenlake is 95/111 vision, 43/59 text. 256 leaves room for a larger frame without letting a
    # runaway observation eat the response region. Undeclared this falls back to
    # DEFAULT_MAX_ENV_RESPONSE=2048, which is not a bound on anything this env does
    # and makes the episode-size warning fire on every run until nobody reads it.
    max_env_response_per_turn: 256
    config: # env-specific config
      render_mode: text
      size: 4
      p: 0.8
      is_slippery: false
      slip_prob: 0.0
      max_actions_per_step: 5
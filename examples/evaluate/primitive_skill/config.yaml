# ★ The eval seeds are disjoint from BOTH the train and val ranges in
# examples/train/, because the same seed is the same instance. They used to start at 0:
# frozenlake's eval overlapped training on 127 of 128 seeds and primitive_skill's on all
# 16, so a fine-tuned checkpoint's "eval" number was its training-set accuracy. 20000+ is
# above every range those configs use.
# ★ The seed range is INCLUSIVE and the third element is an occurrence limit, not a step.
# With limit 1 the loader does `rng.sample(range(min, max+1), n_envs)`, so n_envs must equal
# max-min+1 or a task is dropped at random on every run -- and, where the env indexes its
# dataset as `seed % len(dataset)`, the extra value wraps onto task 0 and scores it twice.
# Measured on navigation before this fix: 59 of 60 tasks evaluated, task 0 counted twice.
defaults:
  - ../../../vagen/configs/eval_default

# Before running eval, start the primitive_skill server:
#   python -m vagen.envs.primitive_skill.serve --port 8000

# Where rollouts and summaries are written. Override with VAGEN_EVAL_ROOT,
# or set fileroot here. Repo-relative by default: the old default was one
# developer's home directory, which every shipped eval config inherited.
fileroot: ${oc.env:VAGEN_EVAL_ROOT,./eval_runs}

envs:
  - name: RemoteEnv
    n_envs: 16
    tag_id: primitive_skill_align_two_cube
    seed: [20000, 20015, 1]
    max_turns: 3  # matches train/val; 5 was a 67% larger turn budget than the val curve
    config:
      base_urls: "http://localhost:8000"
      timeout: 120
      retries: 6
      env_id: AlignTwoCube
      prompt_format: wm
      max_actions_per_step: 2
      action_sep: "|"
      render_mode: vision
      format_reward: 0.1
      success_reward: 1  # matches train/val; 10.0 here made the eval scale 10x the val curve's
    chat_config:
      temperature: 0
      max_tokens: 1024
      top_p: 1.0

  - name: RemoteEnv
    n_envs: 16
    tag_id: primitive_skill_place_two_cube
    seed: [20000, 20015, 1]
    max_turns: 3  # matches train/val; 5 was a 67% larger turn budget than the val curve
    config:
      base_urls: "http://localhost:8000"
      timeout: 120
      retries: 6
      env_id: PlaceTwoCube
      prompt_format: wm
      max_actions_per_step: 2
      action_sep: "|"
      render_mode: vision
      format_reward: 0.1
      success_reward: 1  # matches train/val; 10.0 here made the eval scale 10x the val curve's
    chat_config:
      temperature: 0
      max_tokens: 1024
      top_p: 1.0

  - name: RemoteEnv
    n_envs: 16
    tag_id: primitive_skill_stack_three_cube
    seed: [20000, 20015, 1]
    max_turns: 3  # matches train/val; 5 was a 67% larger turn budget than the val curve
    config:
      base_urls: "http://localhost:8000"
      timeout: 120
      retries: 6
      env_id: StackThreeCube
      prompt_format: wm
      max_actions_per_step: 2
      action_sep: "|"
      render_mode: vision
      format_reward: 0.1
      success_reward: 1  # matches train/val; 10.0 here made the eval scale 10x the val curve's
    chat_config:
      temperature: 0
      max_tokens: 1024
      top_p: 1.0

  - name: RemoteEnv
    n_envs: 16
    tag_id: primitive_skill_put_apple_in_drawer
    seed: [20000, 20015, 1]
    max_turns: 3  # matches train/val; 5 was a 67% larger turn budget than the val curve
    config:
      base_urls: "http://localhost:8000"
      timeout: 120
      retries: 6
      env_id: PutAppleInDrawer
      prompt_format: wm
      max_actions_per_step: 2
      action_sep: "|"
      render_mode: vision
      format_reward: 0.1
      success_reward: 1  # matches train/val; 10.0 here made the eval scale 10x the val curve's
    chat_config:
      temperature: 0
      max_tokens: 1024
      top_p: 1.0

experiment:
  dump_dir: ${fileroot}/rollouts/eval_primitive_skill
  default_max_turns: 3  # matches train/val; 5 was a 67% larger turn budget than the val curve

run:
  backend: "openai"
  base_seed: 0
  max_concurrent_jobs: 16
  resume: skip_completed
  live_summary: true

backends:
  openai:
    api_key: ""               # or export OPENAI_API_KEY
    base_url: null
    model: "gpt-4.1-mini"
    max_concurrency: 8
    max_retries: 6
    min_backoff: 0.5
    max_backoff: 8.0

# ── VAGEN Evaluation Default Config ──────────────────────────────────
# Base config for VAGEN environment evaluations (FrozenLake, Sokoban,
# Navigation, SpatialGym, etc.).
#
# Usage: create a per-experiment config that inherits from this file:
#
#   defaults:
#     - ../../../vagen/configs/eval_default
#
#   envs:
#     - name: FrozenLake
#       ...
#
#   experiment:
#     dump_dir: ${fileroot}/rollouts/my_experiment
#
# Only override the fields you need to change.
# ─────────────────────────────────────────────────────────────────────

# Where rollouts and summaries are written. Override with VAGEN_EVAL_ROOT (an absolute
# path), or set fileroot here. The old default was one developer's home directory, which
# every shipped eval config inherited.
#
# ★ A relative fileroot is resolved against the CONFIG FILE's directory, not the working
# directory and not the repo root -- so this default puts results next to the config, in
# examples/evaluate/<env>/eval_runs/. That is gitignored. Give VAGEN_EVAL_ROOT an absolute
# path if you want them somewhere else; a relative one will surprise you.
fileroot: ${oc.env:VAGEN_EVAL_ROOT,./eval_runs}

experiment:
  dump_dir: ${fileroot}/rollouts/default
  default_max_turns: 5

run:
  backend: "openrouter"
  base_seed: 0
  max_concurrent_jobs: 16
  resume: skip_completed
  live_summary: true

# One backend: OpenRouter's request format (OpenAI Chat Completions plus its extensions
# such as `reasoning`), which chat_config is written in. base_url points it at OpenRouter
# or at any server that speaks the same format: a local vLLM/SGLang server, or a program
# that exposes a model served some other way (Azure, Anthropic, Gemini, ...) in this
# format, such as a LiteLLM proxy.
backends:
  openrouter:
    api_key: ""               # or export OPENROUTER_API_KEY; a local server needs none
    base_url: null            # https://openrouter.ai/api/v1; e.g. http://127.0.0.1:8311/v1
    model: "openai/gpt-4o-mini"
    max_concurrency: 8
    max_retries: 6
    min_backoff: 0.5
    max_backoff: 8.0
